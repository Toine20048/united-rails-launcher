<?xml version="1.0" encoding="UTF-8"?>
<!--
  Unlimited Rails launcher icon.
  The logo artwork itself is embedded verbatim from United-Rails-Logo.png, so
  the shape is exactly the original. Only the tile behind it is drawn here.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" rx="56" fill="#0a0a0b"/>
  <rect x="3" y="3" width="250" height="250" rx="53" fill="none" stroke="#26262b" stroke-width="6"/>
  <image x="40" y="57" width="176" height="141"
         xlink:href="data:image/png;base64,"/>
</svg>
